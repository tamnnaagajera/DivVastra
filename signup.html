<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | DIV VASTRA</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <section class="account-page">

        <p class="simple-label">DIV VASTRA</p>

        <h1>CREATE ACCOUNT</h1>

        <p class="account-intro">
            Create your DIV VASTRA account.
        </p>


        <form
            class="account-form"
            action="/signup"
            method="POST"
        >

            <label for="fullName">
                Full Name
            </label>

            <input
                type="text"
                id="fullName"
                name="fullName"
                placeholder="Enter your name"
                required
            >


            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                required
            >


            <button type="submit">
                CREATE ACCOUNT
            </button>

        </form>


        <p class="account-switch">

            Already have an account?

            <a href="login.html">
                LOGIN
            </a>

        </p>


        <a href="index.html" class="back-home">
            ← BACK TO HOME
        </a>

    </section>

</body>

</html>
